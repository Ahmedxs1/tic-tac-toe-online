<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main page</title>
    <script type="module" src="js/index.js" defer></script>
    <link rel="stylesheet" href="style/index.css">
</head>
<body>
    <header>
        <h1>Tic Tac Toe main page</h1>
    </header>
    <main>
        <aside>
            <p id="player-name">ur player name </p>
            <button id="changename-btn">change name</button>
        </aside>
        <div id="generate-party-key-container">
            <div>
                <button id="generate-party-key-btn">Generate party key</button>
            </div>
            <div>
                <input  type="text"
                        id="join-party-key"
                        placeholder="Enter party key"
                        maxlength="6"
                        minlength="6"
                        autofocus
                >
                <button id="join-party-key-btn">join with party key</button>
            </div>
        </div>
    </main>
</body>
</html>
