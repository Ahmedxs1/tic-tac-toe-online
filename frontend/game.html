<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tic Tac Toe</title>

    <script src="js/game.js" defer></script>
    <link rel="stylesheet" href="style/game.css">
</head>

<body>

    <header>
        <h1>Tic Tac Toe</h1>
        <p id="player-name">ur player name </p>
    </header>

    <main>

        <div id="game-wrapper">

            <!-- Game status -->
            <div id="game-status">

                <div id="player-info">
                    You are <span id="player-char">-</span>
                </div>

                <div id="turn-status">
                    Connecting...
                </div>

            </div>

            <!-- Game board -->
            <div id="game-container">

                <div class="game-row">
                    <div class="game-cell" id="0"></div>
                    <div class="game-cell" id="1"></div>
                    <div class="game-cell" id="2"></div>
                </div>

                <div class="game-row">
                    <div class="game-cell" id="3"></div>
                    <div class="game-cell" id="4"></div>
                    <div class="game-cell" id="5"></div>
                </div>

                <div class="game-row">
                    <div class="game-cell" id="6"></div>
                    <div class="game-cell" id="7"></div>
                    <div class="game-cell" id="8"></div>
                </div>

            </div>

        </div>

    </main>

</body>
</html>
